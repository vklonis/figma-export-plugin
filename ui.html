<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 16px;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 11px;
      background: #ffffff;
      color: #000000;
    }

    h2 {
      margin: 0 0 12px 0;
      font-size: 13px;
      font-weight: 600;
      color: #000000;
    }

    .section {
      margin-bottom: 16px;
    }

    .frame-list {
      border: 1px solid #e5e5e5;
      border-radius: 4px;
      max-height: 300px;
      overflow-y: auto;
      background: #f5f5f5;
    }

    .frame-item {
      padding: 8px 12px;
      border-bottom: 1px solid #e5e5e5;
      cursor: pointer;
      display: flex;
      align-items: center;
      background: #ffffff;
      transition: background 0.1s;
    }

    .frame-item:last-child {
      border-bottom: none;
    }

    .frame-item:hover {
      background: #f0f0f0;
    }

    .frame-item.selected {
      background: #0d99ff;
      color: #ffffff;
    }

    .frame-item input[type="checkbox"] {
      margin-right: 8px;
    }

    .frame-info {
      flex: 1;
    }

    .frame-name {
      font-weight: 500;
      margin-bottom: 2px;
    }

    .frame-size {
      font-size: 10px;
      color: #999999;
    }

    .frame-item.selected .frame-size {
      color: rgba(255, 255, 255, 0.7);
    }

    .buttons {
      display: flex;
      gap: 8px;
    }

    button {
      flex: 1;
      padding: 8px 12px;
      border: none;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.1s;
    }

    button.primary {
      background: #0d99ff;
      color: #ffffff;
    }

    button.primary:hover {
      background: #0088ee;
    }

    button.primary:disabled {
      background: #cccccc;
      cursor: not-allowed;
    }

    button.secondary {
      background: #ffffff;
      color: #000000;
      border: 1px solid #e5e5e5;
    }

    button.secondary:hover {
      background: #f5f5f5;
    }

    .status {
      padding: 12px;
      background: #f5f5f5;
      border-radius: 4px;
      margin-bottom: 16px;
      font-size: 11px;
    }

    .status.loading {
      background: #fff3cd;
      color: #856404;
    }

    .status.success {
      background: #d4edda;
      color: #155724;
    }

    .status.error {
      background: #f8d7da;
      color: #721c24;
    }

    .progress {
      margin-top: 8px;
      height: 4px;
      background: #e5e5e5;
      border-radius: 2px;
      overflow: hidden;
    }

    .progress-bar {
      height: 100%;
      background: #0d99ff;
      transition: width 0.3s;
    }

    .empty-state {
      text-align: center;
      padding: 40px 20px;
      color: #999999;
    }

    .select-all {
      padding: 8px 12px;
      background: #f5f5f5;
      border-bottom: 1px solid #e5e5e5;
      display: flex;
      align-items: center;
      font-size: 11px;
      cursor: pointer;
    }

    .select-all:hover {
      background: #eeeeee;
    }

    .select-all input[type="checkbox"] {
      margin-right: 8px;
    }

    .help-text {
      font-size: 10px;
      color: #999999;
      margin-top: 8px;
      line-height: 1.4;
    }

    .format-selector {
      display: flex;
      gap: 16px;
      padding: 6px 0 2px 0;
    }

    .format-option {
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 11px;
      cursor: pointer;
    }

    .format-option label {
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div id="app">
    <div class="section">
      <h2>BannerForge Export</h2>
      <p class="help-text">
        Select one or more frames and an export format. JSON preserves all layer data. HTML produces a browser-renderable file that matches the Figma layout.
      </p>
    </div>

    <div class="section">
      <div id="status" style="display: none;"></div>

      <div id="frames-container">
        <div class="frame-list">
          <div class="select-all" id="select-all-container" style="display: none;">
            <input type="checkbox" id="select-all">
            <label for="select-all">Select all frames</label>
          </div>
          <div id="frame-list"></div>
        </div>
      </div>
    </div>

    <div class="section">
      <div class="format-selector">
        <div class="format-option">
          <input type="radio" name="export-format" id="format-json" value="json" checked>
          <label for="format-json">JSON</label>
        </div>
        <div class="format-option">
          <input type="radio" name="export-format" id="format-html" value="html">
          <label for="format-html">HTML</label>
        </div>
        <div class="format-option">
          <input type="radio" name="export-format" id="format-both" value="both">
          <label for="format-both">Both</label>
        </div>
      </div>
    </div>

    <div class="buttons">
      <button class="secondary" id="cancel-btn">Cancel</button>
      <button class="primary" id="export-btn" disabled>Export Selected</button>
    </div>
  </div>

  <script>
    let frames = [];
    let selectedFrameIds = new Set();
    let selectedFormat = 'json';

    // Request frames on load
    window.onload = () => {
      parent.postMessage({ pluginMessage: { type: 'get-frames' } }, '*');

      document.querySelectorAll('input[name="export-format"]').forEach(radio => {
        radio.addEventListener('change', (e) => { selectedFormat = e.target.value; });
      });
    };

    // Listen for messages from plugin code
    window.onmessage = (event) => {
      const msg = event.data.pluginMessage;

      if (msg.type === 'frames-list') {
        frames = msg.frames;
        renderFrameList();
      }

      if (msg.type === 'export-progress') {
        showStatus(`Exporting ${msg.frameName}... (${msg.current}/${msg.total})`, 'loading');
        updateProgress(msg.current, msg.total);
      }

      if (msg.type === 'export-complete') {
        showStatus('Export complete! Downloading...', 'success');
        if (selectedFormat === 'json' || selectedFormat === 'both') {
          downloadJSON(msg.data);
        }
        if (selectedFormat === 'html' || selectedFormat === 'both') {
          downloadHTML(msg.data);
        }
        setTimeout(() => {
          parent.postMessage({ pluginMessage: { type: 'cancel' } }, '*');
        }, 1500);
      }

      if (msg.type === 'export-error') {
        showStatus(`Error: ${msg.message}`, 'error');
      }
    };

    function renderFrameList() {
      const frameListEl = document.getElementById('frame-list');
      const selectAllContainer = document.getElementById('select-all-container');

      if (frames.length === 0) {
        frameListEl.innerHTML = '<div class="empty-state">No frames found on current page.<br>Create a frame to get started.</div>';
        selectAllContainer.style.display = 'none';
        return;
      }

      selectAllContainer.style.display = 'flex';

      frameListEl.innerHTML = frames.map(frame => `
        <div class="frame-item" data-id="${frame.id}">
          <input type="checkbox" id="frame-${frame.id}" data-id="${frame.id}">
          <div class="frame-info">
            <div class="frame-name">${escapeHtml(frame.name)}</div>
            <div class="frame-size">${Math.round(frame.width)} × ${Math.round(frame.height)}</div>
          </div>
        </div>
      `).join('');

      // Add click handlers
      frameListEl.querySelectorAll('.frame-item').forEach(item => {
        const frameId = item.dataset.id;
        const checkbox = item.querySelector('input[type="checkbox"]');

        item.addEventListener('click', (e) => {
          if (e.target.type !== 'checkbox') {
            checkbox.checked = !checkbox.checked;
          }
          toggleFrameSelection(frameId, checkbox.checked);
        });

        checkbox.addEventListener('change', (e) => {
          toggleFrameSelection(frameId, e.target.checked);
        });
      });

      // Select all handler
      document.getElementById('select-all').addEventListener('change', (e) => {
        const checked = e.target.checked;
        frameListEl.querySelectorAll('input[type="checkbox"]').forEach(cb => {
          cb.checked = checked;
          toggleFrameSelection(cb.dataset.id, checked);
        });
      });
    }

    function toggleFrameSelection(frameId, selected) {
      const item = document.querySelector(`.frame-item[data-id="${frameId}"]`);

      if (selected) {
        selectedFrameIds.add(frameId);
        item.classList.add('selected');
      } else {
        selectedFrameIds.delete(frameId);
        item.classList.remove('selected');
      }

      updateExportButton();
      updateSelectAllCheckbox();
    }

    function updateSelectAllCheckbox() {
      const selectAllCheckbox = document.getElementById('select-all');
      if (selectedFrameIds.size === 0) {
        selectAllCheckbox.checked = false;
        selectAllCheckbox.indeterminate = false;
      } else if (selectedFrameIds.size === frames.length) {
        selectAllCheckbox.checked = true;
        selectAllCheckbox.indeterminate = false;
      } else {
        selectAllCheckbox.checked = false;
        selectAllCheckbox.indeterminate = true;
      }
    }

    function updateExportButton() {
      const exportBtn = document.getElementById('export-btn');
      const count = selectedFrameIds.size;

      if (count === 0) {
        exportBtn.disabled = true;
        exportBtn.textContent = 'Export Selected';
      } else {
        exportBtn.disabled = false;
        exportBtn.textContent = `Export ${count} Frame${count > 1 ? 's' : ''}`;
      }
    }

    function showStatus(message, type) {
      const statusEl = document.getElementById('status');
      statusEl.textContent = message;
      statusEl.className = `status ${type}`;
      statusEl.style.display = 'block';

      if (type === 'loading') {
        statusEl.innerHTML = message + '<div class="progress"><div class="progress-bar" id="progress-bar"></div></div>';
      }
    }

    function updateProgress(current, total) {
      const progressBar = document.getElementById('progress-bar');
      if (progressBar) {
        const percent = (current / total) * 100;
        progressBar.style.width = percent + '%';
      }
    }

    function downloadJSON(data) {
      const json = JSON.stringify(data, null, 2);
      const blob = new Blob([json], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');

      // Generate filename
      const timestamp = new Date().toISOString().replace(/[:.]/g, '-').slice(0, -5);
      const frameNames = Array.from(selectedFrameIds)
        .map(id => frames.find(f => f.id === id)?.name)
        .filter(Boolean)
        .join('_')
        .replace(/[^a-zA-Z0-9_-]/g, '_')
        .slice(0, 50);

      a.href = url;
      a.download = `bannerforge_${frameNames}_${timestamp}.json`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    function generateHTML(exportData) {
      const images = exportData.images || {};

      function colorToCSS(color, opacity) {
        if (!color) return 'transparent';
        const r = Math.round((color.r || 0) * 255);
        const g = Math.round((color.g || 0) * 255);
        const b = Math.round((color.b || 0) * 255);
        const a = typeof opacity === 'number' ? opacity : 1;
        return `rgba(${r},${g},${b},${a})`;
      }

      function stopsToCSS(stops) {
        return (stops || []).map(s => {
          const c = colorToCSS(s.color, s.color.a ?? 1);
          return `${c} ${Math.round(s.position * 100)}%`;
        }).join(', ');
      }

      function linearGradientToCSS(fill) {
        const t = fill.gradientTransform;
        const a = t[0][0], b = t[0][1];
        const angleDeg = Math.round(Math.atan2(a, -b) * 180 / Math.PI);
        return `linear-gradient(${angleDeg}deg, ${stopsToCSS(fill.gradientStops)})`;
      }

      function radialGradientToCSS(fill) {
        return `radial-gradient(ellipse at center, ${stopsToCSS(fill.gradientStops)})`;
      }

      function fillsToCSS(fills) {
        if (!fills || fills.length === 0) return '';
        // Reverse so first Figma fill is the top CSS layer
        const layers = [...fills].reverse().map(fill => {
          if (!fill.visible && fill.visible !== undefined) return '';
          if (fill.type === 'SOLID') {
            return colorToCSS(fill.color, fill.opacity);
          }
          if (fill.type === 'IMAGE') {
            const b64 = images[fill.imageHash] || '';
            if (b64.length < 4) return '';  // guard: empty/invalid base64 must never reach url()
            const size = fill.scaleMode === 'FIT'  ? 'contain'
                       : fill.scaleMode === 'TILE' ? 'auto'
                       :                             'cover';
            return `url("data:image/png;base64,${b64}") center / ${size} no-repeat`;
          }
          if (fill.type === 'GRADIENT_LINEAR') return linearGradientToCSS(fill);
          if (fill.type === 'GRADIENT_RADIAL') return radialGradientToCSS(fill);
          return '';
        }).filter(Boolean);
        return layers.join(', ');
      }

      function effectsToCSS(effects) {
        if (!effects || effects.length === 0) return {};
        const shadows = [];
        let filterVal = '';
        let backdropVal = '';
        for (const e of effects) {
          if (e.visible === false) continue;
          if (e.type === 'DROP_SHADOW') {
            const c = colorToCSS(e.color, e.color.a ?? 1);
            shadows.push(`${e.offset.x}px ${e.offset.y}px ${e.radius}px ${e.spread || 0}px ${c}`);
          } else if (e.type === 'INNER_SHADOW') {
            const c = colorToCSS(e.color, e.color.a ?? 1);
            shadows.push(`inset ${e.offset.x}px ${e.offset.y}px ${e.radius}px ${e.spread || 0}px ${c}`);
          } else if (e.type === 'LAYER_BLUR') {
            filterVal = `blur(${e.radius}px)`;
          } else if (e.type === 'BACKGROUND_BLUR') {
            backdropVal = `blur(${e.radius}px)`;
          }
        }
        const result = {};
        if (shadows.length) result.boxShadow = shadows.join(', ');
        if (filterVal) result.filter = filterVal;
        if (backdropVal) result.backdropFilter = backdropVal;
        return result;
      }

      function blendModeToCSS(bm) {
        const map = {
          MULTIPLY: 'multiply', SCREEN: 'screen', OVERLAY: 'overlay',
          DARKEN: 'darken', LIGHTEN: 'lighten', COLOR_DODGE: 'color-dodge',
          COLOR_BURN: 'color-burn', HARD_LIGHT: 'hard-light', SOFT_LIGHT: 'soft-light',
          DIFFERENCE: 'difference', EXCLUSION: 'exclusion', HUE: 'hue',
          SATURATION: 'saturation', COLOR: 'color', LUMINOSITY: 'luminosity'
        };
        return map[bm] || 'normal';
      }

      function cornerRadiusToCSS(cr) {
        if (cr === undefined || cr === null) return '';
        if (Array.isArray(cr)) return `${cr[0]}px ${cr[1]}px ${cr[2]}px ${cr[3]}px`;
        return `${cr}px`;
      }

      function isMixed(v) { return typeof v === 'symbol'; }

      function renderNode(node) {
        const isContainer = node.type === 'FRAME' || node.type === 'GROUP'
                         || node.type === 'INSTANCE' || node.type === 'COMPONENT';
        const isText = node.type === 'TEXT';
        const isEllipse = node.type === 'ELLIPSE';

        // node.x/y are parent-relative bounding-box coordinates (Figma's node.x/y),
        // which map directly to CSS left/top since every div has position:absolute
        // and is therefore the positioned ancestor for its children.
        const parts = [
          'position:absolute',
          `left:${node.x}px`,
          `top:${node.y}px`,
          `width:${node.width}px`,
          `height:${node.height}px`,
        ];

        if (typeof node.opacity === 'number' && node.opacity !== 1) {
          parts.push(`opacity:${node.opacity}`);
        }
        if (node.blendMode && node.blendMode !== 'NORMAL') {
          parts.push(`mix-blend-mode:${blendModeToCSS(node.blendMode)}`);
        }
        if (node.rotation) {
          parts.push(`transform:rotate(${-node.rotation}deg)`);
          parts.push('transform-origin:50% 50%');
        }
        // Apply overflow:hidden only when the node explicitly clips its content.
        // GROUP nodes never clip (clipsContent is always false for them).
        // FRAME/INSTANCE/COMPONENT clip only when clipsContent=true (Figma default).
        if (isContainer && node.clipsContent) {
          parts.push('overflow:hidden');
        }

        // Fills
        // IMAGE fills are rendered as <img> elements rather than CSS background-image.
        // CSS url("data:...") inside a file:// document triggers Chrome's cross-origin
        // security check and is silently blocked; <img src="data:..."> is not affected.
        const imgFillTags = [];
        if (node.fills && node.fills.length > 0) {
          if (isText) {
            const solid = node.fills.find(f => f.type === 'SOLID');
            if (solid) parts.push(`color:${colorToCSS(solid.color, solid.opacity)}`);
          } else {
            const visualFills = node.fills.filter(f => f.type !== 'IMAGE');
            const imageFills  = node.fills.filter(f => f.type === 'IMAGE');

            if (visualFills.length > 0) {
              const bg = fillsToCSS(visualFills);
              if (bg) parts.push(`background:${bg}`);
            }

            for (const fill of imageFills) {
              if (fill.visible === false) continue;
              const b64 = images[fill.imageHash] || '';
              if (b64.length < 4) continue;
              const fit = fill.scaleMode === 'FIT'  ? 'contain'
                        : fill.scaleMode === 'TILE' ? 'auto'
                        :                             'cover';
              imgFillTags.push(
                `<img src="data:image/png;base64,${b64}" `
                + `style="position:absolute;top:0;left:0;width:100%;height:100%;`
                + `object-fit:${fit};display:block;" alt="">`
              );
            }
          }
        }

        // Border radius
        if (isEllipse) {
          parts.push('border-radius:50%');
        } else if (node.cornerRadius !== undefined && node.cornerRadius !== null) {
          const cr = cornerRadiusToCSS(node.cornerRadius);
          if (cr) parts.push(`border-radius:${cr}`);
        }

        // Strokes
        if (node.strokes && node.strokes.length > 0 && node.strokeWeight) {
          const sp = node.strokes[0];
          if (sp && sp.type === 'SOLID') {
            const sc = colorToCSS(sp.color, sp.opacity);
            const w = node.strokeWeight;
            const align = node.strokeAlign || 'CENTER';
            if (align === 'INSIDE') {
              parts.push(`box-shadow:inset 0 0 0 ${w}px ${sc}`);
            } else if (align === 'OUTSIDE') {
              parts.push(`box-shadow:0 0 0 ${w}px ${sc}`);
            } else {
              parts.push(`border:${w}px solid ${sc}`);
            }
          }
        }

        // Effects
        const fx = effectsToCSS(node.effects);
        if (fx.boxShadow) {
          // Merge with any stroke shadow already added
          const existing = parts.findIndex(p => p.startsWith('box-shadow:'));
          if (existing >= 0) {
            parts[existing] = parts[existing] + ', ' + fx.boxShadow;
          } else {
            parts.push(`box-shadow:${fx.boxShadow}`);
          }
        }
        if (fx.filter) parts.push(`filter:${fx.filter}`);
        if (fx.backdropFilter) parts.push(`backdrop-filter:${fx.backdropFilter}`);

        const styleStr = parts.join(';');

        // Inner content — image fills rendered first so children stack on top
        let inner = imgFillTags.join('');
        if (isText) {
          const fs = isMixed(node.fontSize) ? 16 : (node.fontSize || 16);
          const fw = node.fontWeight || 400;
          const ff = (!node.fontName || isMixed(node.fontName))
                     ? 'sans-serif'
                     : `"${node.fontName.family}",sans-serif`;
          const alignH = { LEFT: 'left', CENTER: 'center', RIGHT: 'right', JUSTIFIED: 'justify' };
          const ta = alignH[node.textAlignHorizontal] || 'left';
          const alignV = { CENTER: 'center', BOTTOM: 'flex-end' };
          const va = alignV[node.textAlignVertical] || 'flex-start';
          const tcMap = { UPPER: 'uppercase', LOWER: 'lowercase', TITLE: 'capitalize' };
          const tc = tcMap[node.textCase] || 'none';
          const tdMap = { UNDERLINE: 'underline', STRIKETHROUGH: 'line-through' };
          const td = tdMap[node.textDecoration] || 'none';

          let ls = '';
          if (node.letterSpacing && !isMixed(node.letterSpacing)) {
            ls = node.letterSpacing.unit === 'PERCENT'
                 ? `letter-spacing:${node.letterSpacing.value / 100}em;`
                 : `letter-spacing:${node.letterSpacing.value}px;`;
          }
          let lh = '';
          if (node.lineHeight && !isMixed(node.lineHeight) && node.lineHeight.unit !== 'AUTO') {
            lh = node.lineHeight.unit === 'PIXELS'
                 ? `line-height:${node.lineHeight.value}px;`
                 : `line-height:${node.lineHeight.value / 100};`;
          }

          const textStyle = `width:100%;height:100%;display:flex;align-items:${va};`
            + `font-size:${fs}px;font-weight:${fw};font-family:${ff};`
            + `text-align:${ta};text-transform:${tc};text-decoration:${td};`
            + `white-space:pre-wrap;overflow:hidden;${ls}${lh}`;

          inner = `<div style="${textStyle}"><span>${escapeHtml(node.characters || '')}</span></div>`;
        } else if (node.children && node.children.length > 0) {
          inner += node.children.map(child => renderNode(child)).join('');
        }

        return `<div style="${styleStr}">${inner}</div>`;
      }

      const framesHTML = exportData.frames.map(frame => {
        const nodesHTML = frame.nodes.map(node => renderNode(node)).join('');
        return `<section style="position:relative;width:${frame.width}px;height:${frame.height}px;`
          + `background:${frame.backgroundColor};overflow:hidden;display:inline-block;margin:0 0 32px 0;">`
          + nodesHTML
          + `</section>`;
      }).join('\n');

      const title = escapeHtml(exportData.meta.figmaFileName || 'Figma Export');
      const imageKeys = Object.keys(images);
      const debugScript = `<script>\n`
        + `console.log('[BannerForge] images in export (${imageKeys.length}):', ${JSON.stringify(imageKeys)});\n`
        + `document.querySelectorAll('img[src^="data:image"]').forEach((el,i)=>{\n`
        + `  const ok=el.complete&&el.naturalWidth>0;\n`
        + `  console.log('[BannerForge] img['+i+'] '+el.style.cssText.slice(0,60)+' loaded='+ok+' naturalSize='+el.naturalWidth+'x'+el.naturalHeight);\n`
        + `});\n`
        + `<\/script>`;
      return `<!DOCTYPE html>\n<html lang="en">\n<head>\n<meta charset="UTF-8">\n`
        + `<title>${title}</title>\n`
        + `<style>*{margin:0;padding:0;box-sizing:border-box;}`
        + `body{background:#f0f0f0;padding:32px;display:flex;flex-direction:column;align-items:flex-start;}</style>\n`
        + `</head>\n<body>\n${framesHTML}\n${debugScript}\n</body>\n</html>`;
    }

    function downloadHTML(data) {
      const html = generateHTML(data);
      const blob = new Blob([html], { type: 'text/html' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');

      const timestamp = new Date().toISOString().replace(/[:.]/g, '-').slice(0, -5);
      const frameNames = Array.from(selectedFrameIds)
        .map(id => frames.find(f => f.id === id)?.name)
        .filter(Boolean)
        .join('_')
        .replace(/[^a-zA-Z0-9_-]/g, '_')
        .slice(0, 50);

      a.href = url;
      a.download = `bannerforge_${frameNames}_${timestamp}.html`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }

    // Button handlers
    document.getElementById('export-btn').addEventListener('click', () => {
      if (selectedFrameIds.size === 0) return;

      showStatus('Starting export...', 'loading');
      parent.postMessage({
        pluginMessage: {
          type: 'export-frames',
          frameIds: Array.from(selectedFrameIds)
        }
      }, '*');
    });

    document.getElementById('cancel-btn').addEventListener('click', () => {
      parent.postMessage({ pluginMessage: { type: 'cancel' } }, '*');
    });
  </script>
</body>
</html>
